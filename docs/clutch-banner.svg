<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap');
    </style>

    <!-- Deep purple radial background -->
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </radialGradient>

    <!-- Secondary linear overlay for depth (top-left → bottom-right) -->
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0533" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Soft purple glow behind icon + title -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="400" fill="url(#bgRadial)"/>
  <!-- Depth overlay -->
  <rect width="1280" height="400" fill="url(#bgLinear)"/>

  <!-- Glow ellipse behind icon + title group, centered at (640, 178) -->
  <ellipse cx="640" cy="178" rx="460" ry="165" fill="url(#glowGradient)"/>

  <!--
    Layout (all centered at x=640):
      Icon:  52×52, left edge at x=498, top at y=152  → center (524, 178)
      Gap:   16px
      Text:  "Clutch" Roboto Bold 68 — left edge x=566, baseline y=203
      Group estimated width ≈ 52+16+215 = 283px  → left=498, right=781 → center≈640 ✓

    Icon path: Material Symbols "help" (support), original 24×24 viewBox
    Scale factor: 52/24 = 2.1667
    Transform: translate(498, 152) scale(2.1667)
  -->
  <g transform="translate(498, 152) scale(2.1667)">
    <path
      d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"
      fill="#ffffff"
    />
  </g>

  <!-- "Clutch" title -->
  <text
    x="566"
    y="203"
    text-anchor="start"
    font-family="Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="68"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-0.5"
  >Clutch</text>

  <!-- Tagline -->
  <text
    x="640"
    y="268"
    text-anchor="middle"
    font-family="Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#c084fc"
  >Don&#x2019;t Google it. Ask Clutch.</text>
</svg>
